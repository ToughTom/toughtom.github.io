<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帅到掉渣</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080d;
      --ink: #f7f5ee;
      --muted: #a8adbb;
      --gold: #f4c96a;
      --hot: #ff4d8d;
      --mint: #4ce7c1;
      --blue: #66a6ff;
      --panel: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 77, 141, 0.28), transparent 28rem),
        radial-gradient(circle at 84% 8%, rgba(76, 231, 193, 0.22), transparent 26rem),
        radial-gradient(circle at 55% 78%, rgba(102, 166, 255, 0.22), transparent 28rem),
        linear-gradient(135deg, #07080d 0%, #10121b 48%, #05060a 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .shell {
      position: relative;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(244, 201, 106, 0.95), rgba(255, 77, 141, 0.85));
      color: #15100a;
      box-shadow: 0 12px 36px rgba(244, 201, 106, 0.22);
    }

    .nav-note {
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 480px);
      gap: 34px;
      align-items: center;
      min-height: calc(100vh - 116px);
      padding: 38px 0 24px;
    }

    .hero {
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--gold);
    }

    h1 {
      margin: 0;
      max-width: 740px;
      font-size: clamp(54px, 10vw, 132px);
      line-height: 0.9;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .chrome {
      display: inline-block;
      color: transparent;
      background:
        linear-gradient(110deg, #fff7d7 0%, #f4c96a 18%, #ffffff 34%, #ff4d8d 54%, #66a6ff 74%, #4ce7c1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 18px 30px rgba(255, 77, 141, 0.25));
    }

    .tagline {
      max-width: 620px;
      margin: 24px 0 0;
      color: #d7dae4;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 650px;
      margin-top: 34px;
    }

    .stat {
      min-height: 92px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
    }

    .stat strong {
      display: block;
      color: var(--ink);
      font-size: 26px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .game-panel {
      position: relative;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.06)),
        rgba(10, 12, 20, 0.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      overflow: hidden;
    }

    .game-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .game-title {
      min-width: 0;
    }

    .game-title h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
    }

    .game-title p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .pill {
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      min-width: 86px;
      height: 42px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid rgba(244, 201, 106, 0.42);
      color: var(--gold);
      background: rgba(244, 201, 106, 0.1);
      font-size: 13px;
      font-weight: 900;
    }

    .arena {
      position: relative;
      aspect-ratio: 1 / 1;
      min-height: 340px;
      margin: 18px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(244, 201, 106, 0.12), transparent 18%),
        linear-gradient(135deg, rgba(255, 77, 141, 0.16), transparent 34%),
        linear-gradient(315deg, rgba(76, 231, 193, 0.14), transparent 34%),
        #0d1019;
      cursor: crosshair;
      user-select: none;
      touch-action: manipulation;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.55;
    }

    .target {
      position: absolute;
      display: grid;
      place-items: center;
      width: var(--size, 74px);
      height: var(--size, 74px);
      left: 50%;
      top: 50%;
      border: 0;
      border-radius: 50%;
      color: #11131b;
      background:
        radial-gradient(circle at 34% 26%, #ffffff 0 10%, transparent 11%),
        conic-gradient(from 35deg, var(--gold), var(--hot), var(--blue), var(--mint), var(--gold));
      box-shadow: 0 12px 38px rgba(255, 77, 141, 0.42);
      transform: translate(-50%, -50%) scale(1);
      font-size: calc(var(--size, 74px) * 0.42);
      font-weight: 1000;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
      animation: pulse 1s ease-in-out infinite;
    }

    .target:hover {
      filter: saturate(1.18) brightness(1.08);
      transform: translate(-50%, -50%) scale(1.07);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 12px 38px rgba(255, 77, 141, 0.38);
      }
      50% {
        box-shadow: 0 18px 54px rgba(76, 231, 193, 0.34);
      }
    }

    .pop {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      color: var(--gold);
      font-size: 22px;
      font-weight: 1000;
      animation: rise 650ms ease forwards;
    }

    @keyframes rise {
      to {
        opacity: 0;
        transform: translate(-50%, -95%) scale(1.25);
      }
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 18px 18px;
    }

    .meter {
      min-height: 74px;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
    }

    .meter span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .meter strong {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 18px 18px;
    }

    button {
      font: inherit;
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      color: #0d1019;
      background: var(--ink);
      font-weight: 900;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .btn.primary {
      background: linear-gradient(110deg, var(--gold), var(--hot));
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn:active {
      transform: translateY(0);
    }

    .toast {
      min-height: 42px;
      margin: 0 18px 18px;
      padding: 11px 12px;
      border-left: 3px solid var(--mint);
      color: #dbe0ea;
      background: rgba(76, 231, 193, 0.08);
      font-size: 13px;
      line-height: 1.45;
    }

    .shine {
      position: absolute;
      inset: -120px auto auto -90px;
      width: 220px;
      height: 520px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(24deg);
      animation: sweep 5s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 45% {
        translate: -120px 0;
      }
      100% {
        translate: 760px 0;
      }
    }

    @media (max-width: 920px) {
      main {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 36px;
      }

      .game-panel {
        max-width: 560px;
        margin: 0 auto;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      header {
        align-items: flex-start;
      }

      .nav-note {
        max-width: 150px;
        font-size: 12px;
      }

      h1 {
        font-size: clamp(48px, 18vw, 80px);
      }

      .tagline {
        font-size: 17px;
      }

      .stats,
      .hud {
        grid-template-columns: 1fr;
      }

      .stat,
      .meter {
        min-height: 68px;
      }

      .arena {
        min-height: 280px;
        margin: 12px;
      }

      .game-head,
      .hud,
      .actions {
        padding-left: 12px;
        padding-right: 12px;
      }

      .toast {
        margin-left: 12px;
        margin-right: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand" aria-label="帅到掉渣">
        <div class="mark">帅</div>
        <span>帅到掉渣</span>
      </div>
      <div class="nav-note">点击光环，收集帅气碎片</div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">handsome impact laboratory</p>
        <h1 id="page-title"><span class="chrome">帅到掉渣</span></h1>
        <p class="tagline">
          一个会发光、会反应、会让鼠标都显得更精神的页面。这里没有普通访问，只有帅气指数现场飙升。
        </p>
        <div class="stats" aria-label="页面气场数据">
          <div class="stat">
            <strong>99.9%</strong>
            <span>路过屏幕的人会多看一眼</span>
          </div>
          <div class="stat">
            <strong>3s</strong>
            <span>进入状态，开始掉渣</span>
          </div>
          <div class="stat">
            <strong>∞</strong>
            <span>帅气没有上限，手速可以证明</span>
          </div>
        </div>
      </section>

      <section class="game-panel" aria-label="帅气小游戏">
        <div class="shine"></div>
        <div class="game-head">
          <div class="game-title">
            <h2>掉渣捕手</h2>
            <p>30 秒内点击移动光环，连击越高，帅气值越炸。</p>
          </div>
          <div class="pill" id="rank">待出场</div>
        </div>

        <div class="arena" id="arena">
          <button class="target" id="target" type="button" aria-label="点击帅气光环">帅</button>
        </div>

        <div class="hud" aria-live="polite">
          <div class="meter">
            <span>帅气值</span>
            <strong id="score">0</strong>
          </div>
          <div class="meter">
            <span>剩余时间</span>
            <strong id="time">30</strong>
          </div>
          <div class="meter">
            <span>最高连击</span>
            <strong id="combo">0</strong>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="start" type="button">开始掉渣</button>
          <button class="btn" id="reset" type="button">重置气场</button>
        </div>
        <div class="toast" id="message">准备好后点击开始，别让帅气光环闲着。</div>
      </section>
    </main>
  </div>

  <script>
    const arena = document.querySelector("#arena");
    const target = document.querySelector("#target");
    const scoreEl = document.querySelector("#score");
    const timeEl = document.querySelector("#time");
    const comboEl = document.querySelector("#combo");
    const rankEl = document.querySelector("#rank");
    const messageEl = document.querySelector("#message");
    const startBtn = document.querySelector("#start");
    const resetBtn = document.querySelector("#reset");

    let score = 0;
    let timeLeft = 30;
    let combo = 0;
    let bestCombo = 0;
    let running = false;
    let timer = null;
    let missTimer = null;

    const lines = [
      "漂亮，这一下有点耀眼。",
      "手速可以，帅气值开始冒火。",
      "连击起来了，页面都精神了。",
      "稳住，掉下来的都是气场碎片。",
      "这一点，像极了主角登场。"
    ];

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function updateHud() {
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      comboEl.textContent = bestCombo;

      if (!running && score === 0) {
        rankEl.textContent = "待出场";
      } else if (score < 180) {
        rankEl.textContent = "微帅";
      } else if (score < 380) {
        rankEl.textContent = "很帅";
      } else if (score < 650) {
        rankEl.textContent = "爆帅";
      } else {
        rankEl.textContent = "帅到掉渣";
      }
    }

    function moveTarget() {
      const bounds = arena.getBoundingClientRect();
      const size = Math.max(42, 78 - Math.floor(score / 85) * 5);
      const padding = size / 2 + 10;
      const x = padding + Math.random() * Math.max(1, bounds.width - padding * 2);
      const y = padding + Math.random() * Math.max(1, bounds.height - padding * 2);

      target.style.setProperty("--size", `${size}px`);
      target.style.left = `${x}px`;
      target.style.top = `${y}px`;
    }

    function pop(x, y, value) {
      const burst = document.createElement("div");
      burst.className = "pop";
      burst.textContent = `+${value}`;
      burst.style.left = `${x}px`;
      burst.style.top = `${y}px`;
      arena.appendChild(burst);
      setTimeout(() => burst.remove(), 680);
    }

    function armMissTimer() {
      clearTimeout(missTimer);
      missTimer = setTimeout(() => {
        if (!running) return;
        combo = 0;
        setMessage("光环溜走了一次，没事，帅的人会调整节奏。");
        moveTarget();
        armMissTimer();
      }, Math.max(650, 1500 - score * 1.2));
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      combo = 0;
      bestCombo = 0;
      running = true;
      startBtn.textContent = "正在发光";
      startBtn.disabled = true;
      setMessage("开场！盯住光环，点击它。");
      updateHud();
      moveTarget();
      armMissTimer();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft -= 1;
        updateHud();
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      clearTimeout(missTimer);
      startBtn.disabled = false;
      startBtn.textContent = "再帅一次";
      updateHud();

      if (score >= 650) {
        setMessage(`收工，${score} 点帅气值。这个页面已经被你点出光了。`);
      } else if (score >= 380) {
        setMessage(`很猛，${score} 点帅气值。距离掉渣只差一点狠劲。`);
      } else {
        setMessage(`拿到 ${score} 点帅气值。再来一把，手感会热起来。`);
      }
    }

    target.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!running) {
        setMessage("先点开始，帅气光环才正式开工。");
        return;
      }

      combo += 1;
      bestCombo = Math.max(bestCombo, combo);
      const gain = 10 + Math.min(35, combo * 3);
      score += gain;
      pop(event.offsetX + target.offsetLeft - target.offsetWidth / 2, event.offsetY + target.offsetTop - target.offsetHeight / 2, gain);
      setMessage(lines[Math.floor(Math.random() * lines.length)]);
      updateHud();
      moveTarget();
      armMissTimer();
    });

    arena.addEventListener("click", () => {
      if (!running) return;
      combo = 0;
      setMessage("点空了，帅气光环表示：再准一点。");
      updateHud();
    });

    startBtn.addEventListener("click", startGame);

    resetBtn.addEventListener("click", () => {
      running = false;
      clearInterval(timer);
      clearTimeout(missTimer);
      score = 0;
      timeLeft = 30;
      combo = 0;
      bestCombo = 0;
      startBtn.disabled = false;
      startBtn.textContent = "开始掉渣";
      setMessage("气场已重置，随时可以重新帅一把。");
      updateHud();
      moveTarget();
    });

    window.addEventListener("resize", moveTarget);
    updateHud();
    requestAnimationFrame(moveTarget);
  </script>
</body>
</html>
